# Проверки на каждый push и pull request; публикация на GitHub Pages при push в main.
# Версия приложения — последний тег vX.Y.Z; git-info.json собирается здесь, в репозитории лежит заглушка.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Синтаксис JavaScript
        run: for f in docs/*.js; do node --check "$f"; done

      - name: Файлы офлайн-кэша, номер кэша, запрещённые файлы
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/check.py "$BASE"

  # Автотесты в браузере (Playwright, tests/): сценарии на экране телефона с поддельными
  # микрофоном, Google и Диском. При падении — трассы в артефакте test-results.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Зависимости и Chromium
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Автотесты
        run: uv run pytest -p no:warnings --tracing retain-on-failure

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/

  # Сборка и публикация — разные задачи (как в шаблоне GitHub): если искать артефакт
  # в той же задаче сразу после загрузки, deploy-pages иногда его не находит.
  build:
    needs: [check, tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Версия и коммит в git-info.json
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          version=${tag#v}
          python3 - "${version:-0.0.0}" "$(git rev-parse --short=7 HEAD)" "$(git show -s --format=%cI HEAD)" <<'PY'
          import json, sys
          v, c, d = sys.argv[1:]
          open('docs/git-info.json', 'w', encoding='utf-8').write(json.dumps({'version': v, 'commit': c, 'date': d}, indent=2) + '\n')
          PY
          cat docs/git-info.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
